name: SNPAY late-payment manual review isolated acceptance
on:
  push:
    branches: ["codex/snpay-late-payment-manual-review"]
  pull_request:
    paths:
      - "lib/recharges/snpay-late-payment-*"
      - "scripts/ci/snpay-late-payment-*"
      - "supabase/migrations/*snpay_late_payment*"
      - "tests/integration/snpay-late-payment-*"
      - ".github/workflows/snpay-late-payment-manual-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      APP_ENV: test
      NODE_ENV: test
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-only-never-production
      PAYMENT_PROVIDER_MODE: disabled
      DISABLE_EXTERNAL_PROVIDERS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Signed mock SNPAY and admin action integration
        run: node --test tests/integration/snpay-late-payment-manual-review.test.mjs
      - name: Full regression suite
        run: npm test
      - run: npm run typecheck
      - run: npm run build
  atomic-db:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      PGHOST: 127.0.0.1
      PGPORT: "54322"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      SUPABASE_ACCESS_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}
      - name: Start disposable job-local PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          test -z "$SUPABASE_ACCESS_TOKEN"
          test ! -e supabase/.temp/project-ref
          ci_project="$(mktemp -d)"
          cd "$ci_project"
          supabase init
          supabase db start
          echo "CI_SUPABASE_PROJECT=$ci_project" >> "$GITHUB_ENV"
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql -X -v ON_ERROR_STOP=1 -Atqc "select 'CI_DB_READY'" | grep -qx CI_DB_READY
      - name: Load current canonical definitions and late-review test fixture
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -q -f scripts/ci/payment-watcher-minimal-schema.sql
          node scripts/ci/payment-watcher-canonical-rpc.mjs | psql -X -v ON_ERROR_STOP=1 -q
          psql -X -v ON_ERROR_STOP=1 -q -f scripts/ci/snpay-late-payment-schema.sql
      - name: Real atomic rollback, concurrent approvals, repeat and delayed callback
        run: node scripts/ci/snpay-late-payment-real-db.mjs
      - name: Stop isolated PostgreSQL
        if: always()
        shell: bash
        run: |
          if [[ -n "${CI_SUPABASE_PROJECT:-}" ]]; then
            cd "$CI_SUPABASE_PROJECT"
            supabase stop --no-backup
          fi
