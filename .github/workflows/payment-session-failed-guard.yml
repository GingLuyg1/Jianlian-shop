name: Payment session failed guard isolated acceptance
on:
  push:
    branches: [codex/payment-session-failed-fail-closed]
  pull_request:
    paths:
      - lib/payments/**
      - app/payment/**
      - tests/**
      - scripts/ci/payment-session-guard-*
      - supabase/migrations/20261007140629_payment_session_failed_retry_guard_v1.sql
      - supabase/migrations/20261008082216_payment_sessions_deeplink_contract.sql
      - .github/workflows/payment-session-failed-guard.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      APP_ENV: test
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key-not-for-production
      PAYMENT_PROVIDER_MODE: disabled
      DISABLE_EXTERNAL_PROVIDERS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Payment, callback, late-payment and BEP20 regressions
        run: >-
          node --test tests/integration/payment-session-failed-guard.test.mjs
          tests/integration/snpay-deeplink-contract.test.mjs
          tests/integration/snpay-late-payment-manual-review.test.mjs
          tests/unit/snpay-*.test.mjs tests/unit/liuhaoyi-*.test.mjs
          tests/unit/bep20-*.test.mjs tests/unit/payment-*.test.mjs
          tests/regression/liuhaoyi-recovery-production-ops-contract.test.mjs
      - run: npm run typecheck
      - run: npm run build
  isolated-db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ci_payment_session_guard
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports: ['127.0.0.1:54329:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      PGHOST: 127.0.0.1
      PGPORT: '54329'
      PGDATABASE: ci_payment_session_guard
      PGUSER: postgres
      PGPASSWORD: ci-only-disposable-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: PostgreSQL client available
        run: psql --version
      - name: Service and UI regressions
        run: node --test tests/integration/payment-session-failed-guard.test.mjs tests/integration/snpay-deeplink-contract.test.mjs
      - name: Real reserve RPC, historical failed rows, TOCTOU and concurrency
        run: node scripts/ci/payment-session-guard-real-db.mjs
