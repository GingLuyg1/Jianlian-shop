name: Auth Next 15 security upgrade

on:
  push:
    branches: [codex/auth-next15-security-20261113]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auth-next15-security-upgrade
  cancel-in-progress: false

jobs:
  upgrade-and-verify:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'fix(security): upgrade Next.js 15.5.29')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/auth-next15-security-20261113
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Upgrade only Next security dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund next@15.5.29 eslint-config-next@15.5.29
      - name: Install exact lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Migrate all Next 15 async request APIs
        run: npx --yes @next/codemod@15.5.29 next-async-request-api .
      - name: Scan dynamic routes and source safety gates
        shell: bash
        run: |
          mkdir -p .next15-security
          find app -type f \( -name '*\[*.ts' -o -name '*\[*.tsx' \) | sort > .next15-security/dynamic-files.txt || true
          find app -type f \( -path '*/route.ts' -o -path '*/page.tsx' -o -path '*/layout.tsx' \) | grep '\\[' | sort >> .next15-security/dynamic-files.txt || true
          sort -u .next15-security/dynamic-files.txt -o .next15-security/dynamic-files.txt
          test "$(wc -l < .next15-security/dynamic-files.txt)" -ge 52
          if grep -R -n --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' -E '^\s*["'"']use server["'"']\s*;?\s*$' app lib middleware.ts; then exit 1; fi
          if git diff --unified=0 | grep -E '^\\+.*(@ts-ignore|@ts-expect-error|\\bany\\b)' ; then exit 1; fi
          grep -q 'unoptimized: true' next.config.js
      - name: Verify security version
        run: test "$(node -p "require('./node_modules/next/package.json').version")" = "15.5.29"
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit generated dependency and compatibility upgrade
        shell: bash
        run: |
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No upgrade diff produced'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): upgrade Next.js 15.5.29 async APIs'
          git push origin HEAD:codex/auth-next15-security-20261113
