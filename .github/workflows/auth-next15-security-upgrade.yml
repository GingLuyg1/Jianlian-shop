name: Auth Next 15 security upgrade

on:
  push:
    branches: [codex/auth-next15-security-20261113]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auth-next15-security-upgrade
  cancel-in-progress: false

jobs:
  upgrade-and-verify:
    if: "${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'fix(security): upgrade Next.js 15.5.29') }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/auth-next15-security-20261113
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Migrate all Next 15 async request APIs
        run: npx --yes @next/codemod@15.5.29 next-async-request-api .
      - name: Upgrade only Next security dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund next@15.5.29 eslint-config-next@15.5.29
      - name: Install exact lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Scan dynamic routes and source safety gates
        shell: bash
        run: |
          mkdir -p .next15-security
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const files = [];
          function scan(target) {
            if (!fs.existsSync(target)) return;
            if (fs.statSync(target).isDirectory()) {
              for (const name of fs.readdirSync(target)) scan(path.join(target, name));
            } else if (/\.(?:ts|tsx|js|jsx|mjs)$/.test(target)) files.push(target.replaceAll('\\', '/'));
          }
          scan('app');
          scan('lib');
          scan('middleware.ts');
          const dynamic = files.filter(p => p.startsWith('app/') && /\[[^/]+\]/.test(p) && /\/(?:page|route|layout)\.(?:ts|tsx|js|jsx)$/.test(p)).sort();
          fs.writeFileSync('.next15-security/dynamic-files.txt', dynamic.join('\n') + '\n');
          console.log('DYNAMIC_FILES=' + dynamic.length);
          if (dynamic.length < 52) { console.error('Dynamic route coverage below 52'); process.exit(1); }
          const directives = files.filter(p => /^\s*['\"]use server['\"]\s*;?\s*$/m.test(fs.readFileSync(p, 'utf8')));
          if (directives.length) { console.error('Unexpected Server Actions directives:', directives.join(', ')); process.exit(1); }
          const changed = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' }).split(/\r?\n/).filter(p => /\.(?:ts|tsx|js|jsx|mjs)$/.test(p));
          if (changed.length) {
            const diff = execFileSync('git', ['diff', '--unified=0', '--', ...changed], { encoding: 'utf8' });
            const unsafe = diff.split(/\r?\n/).filter(line => line.startsWith('+') && !line.startsWith('+++') && /@ts-(?:ignore|expect-error)|\bany\b/.test(line));
            if (unsafe.length) { console.error('New unsafe type escapes detected:', unsafe.join('\n')); process.exit(1); }
          }
          NODE
          grep -q 'unoptimized: true' next.config.js
      - name: Verify security version
        run: test "$(node -p "require('./node_modules/next/package.json').version")" = "15.5.29"
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit generated dependency and compatibility upgrade
        shell: bash
        run: |
          git add -u
          git diff --cached --check
          git diff --cached --quiet && { echo 'No upgrade diff produced'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): upgrade Next.js 15.5.29 async APIs'
          git push origin HEAD:codex/auth-next15-security-20261113
