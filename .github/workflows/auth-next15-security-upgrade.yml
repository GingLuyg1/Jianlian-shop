name: Auth Next 15 security upgrade

on:
  push:
    branches: [codex/auth-next15-security-20261113]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auth-next15-security-upgrade
  cancel-in-progress: false

jobs:
  upgrade-and-verify:
    if: "github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'fix(security): upgrade Next.js to 15.5.29'"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/auth-next15-security-20261113
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Upgrade only Next security dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund next@15.5.29 eslint-config-next@15.5.29
      - name: Install exact lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify security version and source gates
        shell: bash
        run: |
          test "$(node -p "require('./node_modules/next/package.json').version")" = "15.5.29"
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const extensions = new Set([".ts", ".tsx", ".js", ".mjs"]);
          const matches = [];
          function scan(target) {
            if (!fs.existsSync(target)) return;
            if (fs.statSync(target).isDirectory()) {
              for (const name of fs.readdirSync(target)) scan(path.join(target, name));
              return;
            }
            if (!extensions.has(path.extname(target))) return;
            const content = fs.readFileSync(target, "utf8");
            if (/^\s*["']use server["']\s*;?\s*$/m.test(content)) matches.push(target);
          }
          for (const target of ["app", "lib", "middleware.ts"]) scan(target);
          if (matches.length) {
            console.error("Unexpected Server Actions directives:", matches.join(", "));
            process.exit(1);
          }
          NODE
          grep -q 'unoptimized: true' next.config.js
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit generated dependency upgrade
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then echo 'No dependency diff produced'; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(security): upgrade Next.js to 15.5.29'
          git push origin HEAD:codex/auth-next15-security-20261113
