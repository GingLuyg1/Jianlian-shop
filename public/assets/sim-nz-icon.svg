      <stop offset="0%" stop-color="#0f2b1d"/>
      <stop offset="100%" stop-color="#1b4d3e"/>
    </linearGradient>
    <linearGradient id="nz-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="32" fill="url(#nz-bg)"/>
  <!-- Sim Chip shape -->
  <rect x="42" y="38" width="76" height="84" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M52 50h44a6 6 0 0 1 6 6v36l-10 10H52a6 6 0 0 1-6-6V56a6 6 0 0 1 6-6z" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
