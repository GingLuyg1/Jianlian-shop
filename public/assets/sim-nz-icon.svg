  <text x="80" y="107" text-anchor="middle" fill="#062d1a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="800" font-size="10" letter-spacing="0.5">NEW ZEALAND</text>
